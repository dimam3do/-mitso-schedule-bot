<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Расписание</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    color-scheme: light dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--tg-theme-bg-color, #f4f4f7);
    color: var(--tg-theme-text-color, #1c1c1e);
    padding: 12px 14px 32px;
  }
  h1 {
    font-size: 20px;
    margin: 8px 0 16px;
  }
  .day-card {
    background: var(--tg-theme-secondary-bg-color, #ffffff);
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 12px;
  }
  .day-title {
    font-weight: 600;
    font-size: 16px;
    margin-bottom: 8px;
  }
  .lesson {
    display: flex;
    gap: 10px;
    padding: 8px 0;
    border-top: 1px solid rgba(120,120,128,0.15);
  }
  .lesson:first-child { border-top: none; }
  .lesson-time {
    flex: 0 0 72px;
    font-variant-numeric: tabular-nums;
    color: var(--tg-theme-hint-color, #8e8e93);
    font-size: 13px;
    padding-top: 1px;
  }
  .lesson-info { flex: 1; }
  .lesson-subject { font-size: 14px; line-height: 1.35; }
  .lesson-room {
    font-size: 12px;
    color: var(--tg-theme-hint-color, #8e8e93);
    margin-top: 2px;
  }
  .empty-day {
    color: var(--tg-theme-hint-color, #8e8e93);
    font-size: 14px;
    padding: 4px 0;
  }
  .state-msg {
    text-align: center;
    color: var(--tg-theme-hint-color, #8e8e93);
    margin-top: 40px;
    font-size: 14px;
  }
  .refresh-btn {
    display: block;
    width: 100%;
    margin-top: 8px;
    padding: 10px;
    border: none;
    border-radius: 10px;
    background: var(--tg-theme-button-color, #2481cc);
    color: var(--tg-theme-button-text-color, #ffffff);
    font-size: 14px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <h1>Расписание</h1>
  <div id="content" class="state-msg">Загружаю расписание…</div>
  <button class="refresh-btn" id="refreshBtn" style="display:none;">Обновить</button>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
  }

  const content = document.getElementById('content');
  const refreshBtn = document.getElementById('refreshBtn');

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function renderSchedule(days) {
    if (!days || days.length === 0) {
      content.className = 'state-msg';
      content.textContent = 'Расписание пустое.';
      return;
    }
    content.className = '';
    content.innerHTML = days.map(day => {
      const lessonsHtml = day.lessons.length
        ? day.lessons.map(l => `
            <div class="lesson">
              <div class="lesson-time">${escapeHtml(l.time)}</div>
              <div class="lesson-info">
                <div class="lesson-subject">${escapeHtml(l.subject)}</div>
                <div class="lesson-room">${escapeHtml(l.room)}</div>
              </div>
            </div>
          `).join('')
        : '<div class="empty-day">Пар нет</div>';

      return `
        <div class="day-card">
          <div class="day-title">${escapeHtml(day.day)}</div>
          ${lessonsHtml}
        </div>
      `;
    }).join('');
  }

  async function loadSchedule(force = false) {
    content.className = 'state-msg';
    content.textContent = 'Загружаю расписание…';
    refreshBtn.style.display = 'none';
    try {
      const res = await fetch(`/api/schedule${force ? '?force=true' : ''}`);
      if (!res.ok) throw new Error('Сервер вернул ошибку');
      const data = await res.json();
      renderSchedule(data.days);
    } catch (e) {
      content.className = 'state-msg';
      content.textContent = 'Не получилось загрузить расписание. Попробуй обновить.';
    } finally {
      refreshBtn.style.display = 'block';
    }
  }

  refreshBtn.addEventListener('click', () => loadSchedule(true));
  loadSchedule();
</script>
</body>
</html>
